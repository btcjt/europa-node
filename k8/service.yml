apiVersion: v1
kind: Service
metadata:
  name: europa-node-service
  namespace: europa-node
spec:
  # The daemon runs on hostNetwork: this Service is purely for in-cluster
  # routes (the HTTPRoute below). The selector still works because the
  # pod's labels are unchanged; kube-proxy maps to the pod IP which on
  # hostNetwork IS the node IP.
  selector:
    app: europa-node
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
